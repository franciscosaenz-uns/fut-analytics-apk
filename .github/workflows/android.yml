name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas del motor de análisis
        run: ./gradlew :core:test
      - name: Compilar APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      # En las ramas de trabajo se guardan capturas de las pantallas para revisarlas.
      - name: Capturas de pantalla
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest
          mkdir -p docs/screenshots
          cp app/build/screenshots/*.png docs/screenshots/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Capturas de pantalla de la interfaz [skip ci]" && git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: futbol-analisis-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Copiar APK con nombre legible
        id: ver
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk futbol-analisis.apk
          echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      # Publica el APK en la pagina de Releases para descargarlo directo desde el telefono.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Fútbol Análisis v${{ steps.ver.outputs.version }}
          prerelease: true
          body: APK compilado automáticamente desde main. Instálalo en Android permitiendo "instalar apps desconocidas".
          files: futbol-analisis.apk
